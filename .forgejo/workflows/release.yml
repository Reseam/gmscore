name: release

on:
  push:
    tags:
      - 'v*'
  # Builds the release without uploading, to validate a release or warm the caches.
  workflow_dispatch:

jobs:
  build:
    name: Build and release
    runs-on: docker
    container:
      image: cimg/android:2026.03-node
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version name and code come from the tag; anything else would publish a mislabelled build.
      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${{ github.ref_name }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-r[1-9]$'

      # The image's user cannot write the default /opt/hostedtoolcache.
      - name: Use a writable tool cache
        run: echo "RUNNER_TOOL_CACHE=$HOME/hostedtoolcache" >> "$GITHUB_ENV"

      - name: Cache the JDK
        uses: actions/cache@v4
        with:
          path: ~/hostedtoolcache
          key: temurin-17

      - name: Set up Java
        uses: https://github.com/actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache the Android platform and build tools
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/platforms/android-35
            ~/android-sdk/build-tools/35.0.0
          key: android-35-build-tools-35.0.0

      - name: Install the Android platform and build tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Releases run on tags, which setup-gradle treats as read-only by default.
      - name: Set up Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Build
        env:
          GRADLE_OPTS: -Xmx1g
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx3g :play-services-core:assembleMapboxUserRelease :play-services-core:assembleMapboxHuaweiRelease

      - name: Sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.GMSCORE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GMSCORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GMSCORE_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.GMSCORE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/gmscore.jks"
          version=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.0.0-{0}', github.run_number) }}
          version=${version#v}
          outputs=play-services-core/build/outputs/apk
          mkdir dist
          sign() {
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/gmscore.jks" \
              --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "dist/$2" "$1"
          }
          sign "$outputs"/mapboxUser/release/*.apk "reseam-gmscore-$version.apk"
          sign "$outputs"/mapboxHuawei/release/*.apk "reseam-gmscore-$version-huawei.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      # Before the Forgejo release, so every published tag has its APKs on the CDN.
      - name: Upload to the CDN
        if: startsWith(github.ref, 'refs/tags/')
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for f in dist/*; do
            curl -fsS --aws-sigv4 aws:amz:auto:s3 --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" \
              -H "Cache-Control: public, max-age=86400" \
              -T "$f" "$R2_ENDPOINT/reseam-releases/gmscore/${{ github.ref_name }}/${f##*/}"
          done

      # The APKs are served from the CDN; the release carries only their checksums.
      - name: Stage the release
        if: startsWith(github.ref, 'refs/tags/')
        run: mkdir release && cp dist/SHA256SUMS release/

      - name: Upload to the Forgejo release
        if: startsWith(github.ref, 'refs/tags/')
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: https://git.reseam.app
          repo: reseam/gmscore
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ github.token }}
          release-dir: release
          override: true

      - name: Keep the last two releases on the CDN
        if: startsWith(github.ref, 'refs/tags/')
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          r2() { curl -fsS --aws-sigv4 aws:amz:auto:s3 --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" "$@"; }
          bucket="$R2_ENDPOINT/reseam-releases"
          for old in $(r2 "$bucket?list-type=2&prefix=gmscore/&delimiter=/" | grep -oP '(?<=<Prefix>)gmscore/[^<]+' | sort -V | head -n -2); do
            for key in $(r2 "$bucket?list-type=2&prefix=$old" | grep -oP '(?<=<Key>)[^<]+'); do
              r2 -X DELETE "$bucket/$key"
            done
          done
